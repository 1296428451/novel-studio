<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 配置 - 长篇小说审核</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <span class="logo">📖 小说创作助手</span>
  <a href="index.html">审校</a>
  <a href="review.html">审校确认</a>
  <a href="create.html">创作</a>
  <a href="config.html" class="active">API 配置</a>
</div>
<div class="container">
  <div class="card">
    <h2>OpenAI 兼容接口配置</h2>
    <p class="muted" style="margin-bottom:14px;">
      配置调用 API 所需的参数，保存后用于文本总结、分块与问题检测。支持任何 OpenAI 兼容的 chat/completions 接口（含代理与私有部署）。
      API Key 仅保存在本机 <code>data/config.json</code>，不会上传到其它服务器。
    </p>
    <div style="margin-bottom:12px;">
      <label style="display:block; margin-bottom:6px; font-size:14px;">Base URL（如 https://api.openai.com/v1 或代理地址）</label>
      <input type="text" id="baseUrl" placeholder="https://api.openai.com/v1">
    </div>
    <div style="margin-bottom:12px;">
      <label style="display:block; margin-bottom:6px; font-size:14px;">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>
    <div style="margin-bottom:16px;">
      <label style="display:block; margin-bottom:6px; font-size:14px;">模型名</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="position:relative; flex:1;">
          <div style="display:flex; border:1px solid var(--border, #ccc); border-radius:6px; overflow:visible;">
            <input type="text" id="model" placeholder="gpt-4o / claude-3-5-sonnet / qwen…" style="flex:1; border:none; outline:none; padding:8px 12px; font-size:14px; background:transparent;">
            <button id="btnDropdown" style="border:none; background:transparent; padding:0 10px; cursor:pointer; font-size:12px; color:#888;" title="展开模型列表">▼</button>
          </div>
          <div id="modelDropdown" style="display:none; position:absolute; top:100%; left:0; right:0; z-index:50; background:#fff; border:1px solid #d0d5dd; border-radius:0 0 6px 6px; max-height:240px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.1);">
          </div>
        </div>
        <button class="btn btn-mini" id="btnFetchModels" style="white-space:nowrap;">获取模型</button>
        <span id="modelHint" class="muted" style="font-size:12px;"></span>
      </div>
    </div>
    <div style="display:flex; gap:12px; align-items:center;">
      <button class="btn" id="btnSave">保存配置</button>
      <span id="msg" style="font-size:14px;"></span>
    </div>
  </div>
</div>
<script src="api.js"></script>
<script>
const baseUrlEl = document.getElementById('baseUrl');
const apiKeyEl = document.getElementById('apiKey');
const modelEl = document.getElementById('model');
const msg = document.getElementById('msg');
const modelDropdown = document.getElementById('modelDropdown');
const modelHint = document.getElementById('modelHint');
const btnDropdown = document.getElementById('btnDropdown');

async function load() {
  try {
    const cfg = await fetch('/api/config').then(apijson);
    baseUrlEl.value = cfg.baseUrl || '';
    apiKeyEl.value = cfg.apiKey || '';
    modelEl.value = cfg.model || '';
  } catch (_) {}
}
load();

document.getElementById('btnSave').addEventListener('click', async () => {
  msg.textContent = '保存中…';
  const body = {
    baseUrl: baseUrlEl.value.trim(),
    apiKey: apiKeyEl.value.trim(),
    model: modelEl.value.trim()
  };
  try {
    const r = await fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(apijson);
    if (r.ok) msg.textContent = '✅ 已保存，可返回到主界面开始审核';
    else msg.textContent = '❌ ' + (r.error || '保存失败');
  } catch (e) {
    msg.textContent = '❌ ' + e.message;
  }
});

document.getElementById('btnFetchModels').addEventListener('click', async () => {
  modelHint.textContent = '获取中…';
  modelDropdown.style.display = 'none';
  modelDropdown.innerHTML = '';
  try {
    const r = await fetch('/api/models').then(apijson);
    if (r.error) throw new Error(r.error);
    const models = r.models || [];
    models.forEach(m => {
      const item = document.createElement('div');
      item.textContent = m;
      item.style.cssText = 'padding:8px 12px; cursor:pointer; font-size:13px; transition:background .12s;';
      item.addEventListener('mouseenter', () => item.style.background = '#f0f4ff');
      item.addEventListener('mouseleave', () => item.style.background = '');
      item.addEventListener('click', () => {
        modelEl.value = m;
        modelDropdown.style.display = 'none';
      });
      modelDropdown.appendChild(item);
    });
    modelHint.textContent = `共 ${models.length} 个模型可用`;
    if (models.length === 1 && !modelEl.value) {
      modelEl.value = models[0];
    }
  } catch (e) {
    modelHint.textContent = '❌ ' + e.message;
  }
});

btnDropdown.addEventListener('click', (e) => {
  e.stopPropagation();
  if (modelDropdown.children.length === 0) {
    document.getElementById('btnFetchModels').click();
    return;
  }
  modelDropdown.style.display = modelDropdown.style.display === 'block' ? 'none' : 'block';
});

modelEl.addEventListener('focus', () => {
  if (modelDropdown.children.length > 0) {
    modelDropdown.style.display = 'block';
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#model') && !e.target.closest('#btnDropdown') && !e.target.closest('#modelDropdown')) {
    modelDropdown.style.display = 'none';
  }
});
</script>
</body>
</html>
