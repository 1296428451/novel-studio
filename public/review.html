<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>审校确认 - 小说创作助手</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <span class="logo">📖 小说创作助手</span>
  <a href="index.html">审校</a>
  <a href="review.html" class="active">审校确认</a>
  <a href="create.html">创作</a>
  <a href="config.html">API 配置</a>
</div>
<div class="container">
  <div class="card">
    <h2>逐条审校 <span class="badge" id="countBadge">0 条</span></h2>
    <p class="muted" style="margin-bottom:10px;">
      每条问题都给出了原句、AI 原因和建议句。你可以直接采用建议句，或在输入框中修改为自己认可的表述，然后点击「保存」。
    </p>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
      <button class="btn btn-success" id="btnNewReview">新的审核任务</button>
    </div>
    <div class="err-banner" id="err" style="display:none;"></div>
  </div>

  <div class="card" id="historyCard">
    <h2>已完成的审核记录（点击查看）</h2>
    <div id="historyList"><span class="muted">加载中…</span></div>
  </div>

  <div id="list"></div>
  <div class="empty" id="empty" style="display:none;">
    暂无问题。请从上方已完成的审核记录中选择一条查看。
  </div>
</div>

<script src="api.js"></script>
<script>
const errEl = document.getElementById('err');
const listEl = document.getElementById('list');
const emptyEl = document.getElementById('empty');
const countBadge = document.getElementById('countBadge');
const historyList = document.getElementById('historyList');

let currentTime = '';

function getTimeFromUrl() {
  const p = new URLSearchParams(location.search);
  return p.get('time');
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

async function loadHistory() {
  try {
    const list = await fetch('/api/history').then(apijson);
    historyList.innerHTML = '';
    const completed = list.filter(h => h.completed);
    if (!completed.length) {
      historyList.innerHTML = '<span class="muted">暂无已完成的审核记录</span>';
      return;
    }
    completed.forEach(h => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; border:1px solid #eee; border-radius:8px; margin-bottom:6px; cursor:pointer; transition:background .15s;';
      row.innerHTML = `
        <div style="min-width:0;">
          <div style="font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${escapeHtml((h.title || h.time).slice(0, 60))}
          </div>
          <div class="muted" style="font-size:12px; margin-top:2px;">
            ${h.time}｜检测到 <strong>${h.evaluateCount}</strong> 处问题
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex:none;">
          <button class="btn btn-mini" data-action="delete" style="background:#fff0f0; color:#ef4444; border:1px solid #fecaca; cursor:pointer; padding:4px 10px; font-size:12px; border-radius:4px;">删除</button>
          <span class="muted">查看 →</span>
        </div>`;
      row.addEventListener('mouseenter', () => row.style.background = '#f7f7f7');
      row.addEventListener('mouseleave', () => row.style.background = '');
      row.addEventListener('click', (e) => {
        if (e.target.closest('[data-action=delete]')) return;
        currentTime = h.time;
        load();
      });
      row.querySelector('[data-action=delete]').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteHistory(h.time);
      });
      historyList.appendChild(row);
    });
  } catch (_) {
    historyList.innerHTML = '<span class="muted">加载失败</span>';
  }
}

async function deleteHistory(timeId) {
  if (!confirm('确定要删除这条审核记录吗？此操作不可恢复。')) return;
  try {
    const r = await fetch('/api/history?time=' + encodeURIComponent(timeId), { method: 'DELETE' }).then(apijson);
    if (r.error) throw new Error(r.error);
    if (currentTime === timeId) { currentTime = ''; listEl.innerHTML = ''; emptyEl.style.display = 'block'; countBadge.textContent = '0 条'; }
    loadHistory();
  } catch (e) { alert('删除失败：' + e.message); }
}

async function load() {
  if (!currentTime) { errEl.style.display = 'block'; errEl.textContent = '请先选择一条审核记录。'; return; }
  errEl.style.display = 'none';
  listEl.innerHTML = '';
  try {
    const r = await fetch('/api/result?time=' + encodeURIComponent(currentTime)).then(apijson);
    if (r.error) throw new Error(r.error);
    render(r.suggestions);
  } catch (e) {
    errEl.style.display = 'block';
    errEl.textContent = '加载失败：' + e.message;
  }
}

function render(suggestions) {
  countBadge.textContent = suggestions.length + ' 条';
  emptyEl.style.display = suggestions.length ? 'none' : 'block';
  listEl.innerHTML = '';
  if (!suggestions.length) return;

  suggestions.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'issue';
    card.innerHTML = `
      <div class="head">
        <span class="muted">#${i + 1}｜第 ${s.line} 行｜块 ${s.blockIndex + 1}</span>
        <span class="tag">${s.id}</span>
      </div>
      <div class="orig">原文句：${escapeHtml(s.original)}</div>
      <div class="reason">问题原因（${escapeHtml(s.issue)}）</div>
      <div class="sug">AI 建议：${escapeHtml(s.suggested)}</div>
      <div class="affirm">
        <textarea data-field="affirm" rows="2" placeholder="在此输入最终认可的表述（可修改上述建议句后填入）">${escapeHtml(s.userAffirm || '')}</textarea>
        <button class="btn btn-mini btn-success" data-action="save">保存</button>
        <span class="save-msg" data-el="msg" style="display:none;">已保存</span>
      </div>
    `;
    const saveBtn = card.querySelector('[data-action=save]');
    const textarea = card.querySelector('[data-field=affirm]');
    const msg = card.querySelector('[data-el=msg]');
    saveBtn.addEventListener('click', async () => {
      const val = textarea.value;
      msg.style.display = 'inline';
      msg.textContent = '保存中…';
      try {
        const r = await fetch('/api/affirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ time: currentTime, id: s.id, userAffirm: val })
        }).then(apijson);
        if (!r.ok && r.error) throw new Error(r.error);
        msg.textContent = '✅ 已保存';
        setTimeout(() => msg.style.display = 'none', 1500);
      } catch (e) {
        msg.textContent = '❌ ' + e.message;
      }
    });
    listEl.appendChild(card);
  });
}

document.getElementById('btnNewReview').addEventListener('click', () => {
  localStorage.removeItem('novelReviewCurrentTime');
  window.location.href = 'index.html';
});

loadHistory();

const urlTime = getTimeFromUrl();
if (urlTime) { currentTime = urlTime; load(); }
</script>
</body>
</html>
